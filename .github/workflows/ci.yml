name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [20, 22, 24] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: baan_pos
          POSTGRES_USER: baan
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U baan -d baan_pos"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://baan:test-only@localhost:5432/baan_pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: psql "$DATABASE_URL" -f server/postgres-schema.sql
      - run: psql "$DATABASE_URL" -c "INSERT INTO tenants(name,slug) VALUES ('CI A','ci-a'),('CI B','ci-b')"
      - run: npm run test:pg
