services:
  - type: web
    name: baan-pos-staging
    runtime: docker
    plan: free
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: baan-pos-staging-db
          property: connectionString
      - key: PG_TENANT_ID
        value: 1683025e-9202-4b3a-946f-eb22576df898
      - key: HTTPS_ONLY
        value: 1
      - key: TRUST_PROXY
        value: 1
      - key: PAYMENT_MODE
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPN_PUBLIC_KEY
        sync: false
      - key: OPN_SECRET_KEY
        sync: false
      - key: OPN_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: BACKUP_ENABLED
        value: 1
      - key: BACKUP_INITIAL_DELAY_MS
        value: 60000
      - key: BACKUP_INTERVAL_MS
        value: 86400000
      - key: S3_BUCKET
        value: baan-pos-backups
      - key: S3_PREFIX
        value: postgres
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_ENDPOINT_URL
        value: https://eba805ce20eb96fd6be305972cab5109.r2.cloudflarestorage.com
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
databases:
  - name: baan-pos-staging-db
    plan: free
    databaseName: baan_pos
    user: baan_pos
    ipAllowList: []
